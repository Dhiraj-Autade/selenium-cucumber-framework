# Browser Configuration
browser=chrome
headless=false

# Base URL
base.url=https://www.saucedemo.com/

# Timeouts (in seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=20

# Environment
environment=test

# Logging
log.level=INFO

# Screenshots
screenshot.on.failure=true
screenshot.path=./screenshots/

# Report Path
report.path=./target/cucumber-reports/
